<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:["\"Plus Jakarta Sans\"","system-ui","sans-serif"]}}}}</script>
<style type="text/tailwindcss">
  @layer components {
    .card { @apply rounded-2xl bg-violet-950/40 p-4 shadow-xl ring-1 ring-white/20 backdrop-blur-xl sm:p-6; }
    .field { @apply h-12 w-full rounded-xl bg-white/10 px-4 text-base text-white placeholder-white/60 ring-1 ring-white/25 focus:outline-none focus:ring-2 focus:ring-white; }
    .btn, .btn-ghost, .btn-danger { @apply inline-flex h-12 items-center justify-center gap-2 rounded-xl px-5 text-sm font-semibold text-white shadow-lg ring-1 ring-white/20 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white disabled:opacity-60; }
    .btn { @apply bg-violet-900 hover:bg-violet-950; }
    .btn-ghost { @apply bg-white/10 hover:bg-white/20; }
    .btn-danger { @apply bg-rose-700 hover:bg-rose-800; }
    .btn-sm { @apply h-10 px-3; }
    .title-grad { @apply bg-gradient-to-r from-white to-fuchsia-200 bg-clip-text text-transparent; }
  }
</style>
<title>Escáner</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-600 via-purple-600 to-fuchsia-600 bg-fixed font-sans text-white antialiased">
<main class="mx-auto w-full max-w-xl px-4 py-8 sm:py-14">
  <header class="mb-6 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="grid h-11 w-11 place-items-center rounded-xl bg-violet-900 ring-1 ring-white/20"><i data-lucide="scan-search" class="h-6 w-6"></i></span>
      <h1 class="title-grad text-3xl font-bold tracking-tight">Escáner</h1>
    </div>
    <a href="resultados.html" class="btn-ghost btn-sm"><i data-lucide="list-checks" class="h-4 w-4"></i>Resultados</a>
  </header>

  <details id="tokenBox" class="card group mb-4">
    <summary class="flex cursor-pointer list-none items-center gap-3 font-semibold [&::-webkit-details-marker]:hidden">
      <i data-lucide="key-round" class="h-5 w-5"></i>Token de GitHub
      <i data-lucide="chevron-down" class="ml-auto h-5 w-5 transition group-open:rotate-180"></i>
    </summary>
    <div class="mt-4 space-y-3">
      <input id="token" type="password" class="field" placeholder="github_pat_..." autocomplete="off" aria-label="Token de GitHub">
      <button type="button" id="saveToken" class="btn-ghost w-full">Guardar y comprobar</button>
      <p id="tokenEstado" class="text-sm text-violet-100" role="status"></p>
    </div>
  </details>

  <form id="scannerForm" class="card space-y-3">
    <input id="serie_name" class="field" placeholder="Nombre de la serie" aria-label="Nombre de la serie" required>
    <div id="urls" class="space-y-3"></div>
    <button type="button" id="addUrlBtn" class="btn-ghost w-full"><i data-lucide="plus" class="h-4 w-4"></i>Añadir episodio</button>
    <button type="submit" id="submitBtn" class="btn w-full"><i data-lucide="play" class="h-4 w-4"></i><span>Iniciar análisis</span></button>
  </form>
</main>

<script src="config.js"></script>
<script src="ui.js"></script>
<script>
  const { owner: REPO_OWNER, repo: REPO_NAME, branch: BRANCH } = CONFIG;
  const $ = id => document.getElementById(id);
  $('token').value = localStorage.getItem('gh_token') || '';
  if (!getToken()) $('tokenBox').open = true;

  function estado(texto, tipo) {
    const el = $('tokenEstado');
    el.textContent = texto;
    el.className = 'text-sm ' + (tipo === 'ok' ? 'text-emerald-200' : tipo === 'error' ? 'text-rose-200' : 'text-violet-100');
  }

  $('saveToken').addEventListener('click', async () => {
    const t = $('token').value.trim();
    if (!t) { estado('Pega primero tu token.', 'error'); return; }
    localStorage.setItem('gh_token', t);
    estado('Comprobando...');
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, {
        headers: { 'Authorization': `Bearer ${t}`, 'Accept': 'application/vnd.github+json' }
      });
      if (r.ok) estado('Token guardado y válido para este repositorio.', 'ok');
      else if (r.status === 401) estado('El token es inválido o fue revocado. Genera uno nuevo.', 'error');
      else if (r.status === 404) estado('Token guardado, pero sin acceso a este repositorio.', 'error');
      else estado('Token guardado. GitHub respondió ' + r.status + '.', 'error');
    } catch (err) {
      estado('Token guardado. No se pudo comprobar: ' + err.message, 'error');
    }
  });

  let n = 0;
  function addUrl() {
    n++;
    const row = document.createElement('div');
    row.className = 'flex gap-3';
    row.innerHTML = `<input type="url" class="field video_url" placeholder="https://ejemplo.com/ep${n}.mp4" aria-label="URL del episodio ${n}" required>` +
      (n > 2 ? '<button type="button" class="btn-ghost w-12 shrink-0 !px-0" aria-label="Quitar episodio"><i data-lucide="x" class="h-4 w-4"></i></button>' : '');
    const quitar = row.querySelector('button');
    if (quitar) quitar.addEventListener('click', () => row.remove());
    $('urls').appendChild(row);
    icons();
  }
  addUrl(); addUrl();
  $('addUrlBtn').addEventListener('click', addUrl);

  $('scannerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('submitBtn'), etiqueta = btn.querySelector('span');
    const token = getToken();
    if (!token) { toast('Guarda primero tu token de GitHub.', 'error'); $('tokenBox').open = true; return; }

    const serie = $('serie_name').value.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    const urls = Array.from(document.querySelectorAll('.video_url')).map(i => i.value.trim()).filter(Boolean);
    if (!serie) { toast('Escribe un nombre de serie válido.', 'error'); return; }
    if (urls.length < 2) { toast('Añade al menos 2 episodios.', 'error'); return; }

    btn.disabled = true;
    etiqueta.textContent = 'Enviando...';
    try {
      const r = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/detector.yml/dispatches`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ref: BRANCH, inputs: { serie_name: serie, video_urls: JSON.stringify(urls) } })
      });
      if (r.status === 204) {
        toast('Análisis iniciado. Los resultados aparecerán al terminar.', 'ok');
        setTimeout(() => { window.location.href = 'resultados.html'; }, 1200);
        return;
      }
      let d = ''; try { d = (await r.json()).message || ''; } catch (_) {}
      const ayuda = {
        401: 'El token es inválido o fue revocado.',
        403: 'El token no tiene el permiso Actions: Read and write.',
        404: 'Revisa que el token tenga acceso al repositorio y que detector.yml esté en .github/workflows.',
        422: 'GitHub no encontró el workflow o la rama ' + BRANCH + '.'
      }[r.status] || '';
      toast(`Error ${r.status}. ${ayuda} ${d}`.trim(), 'error');
    } catch (err) {
      toast('Error de red: ' + err.message, 'error');
    }
    btn.disabled = false;
    etiqueta.textContent = 'Iniciar análisis';
  });

  icons();
</script>
</body>
</html>
